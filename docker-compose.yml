services:
  db:
    image: postgis/postgis:17-3.5
    # 이 태그는 arm64 이미지가 없어 Apple Silicon에서도 amd64로 실행한다.
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nearby}
      POSTGRES_USER: ${POSTGRES_USER:-nearby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nearby}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nearby-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nearby-postgres:
