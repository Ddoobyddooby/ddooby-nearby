[project]
name = "ddooby-nearby-backend"
version = "0.1.0"
description = "지금, 여기! API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2,<3",
  "alembic>=1,<2",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.10,<1"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
